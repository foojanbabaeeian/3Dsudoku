<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jumbo 3D Sudoku</title>
  <link rel="icon" href="data:,">
  <script type="importmap">
  {"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #07090f;
      color: #c8d8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Header */
    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px;
      background: #0d1220;
      border-bottom: 1px solid #1a2a4a;
      flex-shrink: 0;
      gap: 12px;
      flex-wrap: wrap;
    }
    #title {
      font-size: 19px;
      font-weight: 700;
      color: #5a9fff;
      letter-spacing: 1px;
      white-space: nowrap;
    }
    #header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    #timer {
      font-size: 17px;
      font-family: monospace;
      color: #7aafff;
      min-width: 52px;
    }

    select, button {
      background: #1a2a4a;
      color: #c8d8f0;
      border: 1px solid #2a4070;
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    select:hover, button:hover { background: #243a60; }
    button:active { background: #1a3050; }
    button.primary {
      background: #1a4080;
      border-color: #3a70c0;
      color: #aad0ff;
      font-weight: 600;
    }
    button.primary:hover { background: #1e50a0; }

    /* Layout */
    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    #canvas-wrap {
      flex: 1;
      position: relative;
      min-width: 0;
    }
    #canvas-wrap canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Side Panel */
    #side-panel {
      width: 190px;
      background: #0d1220;
      border-left: 1px solid #1a2a4a;
      display: flex;
      flex-direction: column;
      padding: 14px 10px;
      gap: 16px;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #3a5080;
      margin-bottom: 4px;
    }

    /* Number pad */
    #num-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }
    .num-btn {
      aspect-ratio: 1;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border-radius: 8px;
      transition: background 0.1s, border-color 0.1s;
    }
    .num-btn.lit {
      background: #1e4090;
      border-color: #4a80d0;
      color: #cce0ff;
    }
    #erase-btn, #notes-btn {
      width: 100%;
      font-size: 13px;
      margin-top: 5px;
    }
    #notes-btn.on {
      background: #1a4030;
      border-color: #3a9060;
      color: #80e0a0;
    }

    /* Face focus */
    #face-btns {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .face-btn {
      font-size: 12px;
      text-align: left;
      padding: 7px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .face-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .face-btn.active {
      background: #172040;
      border-color: #3a6090;
    }

    /* Progress */
    #progress-wrap { display: flex; flex-direction: column; gap: 8px; }
    .prog-row { display: flex; flex-direction: column; gap: 3px; }
    .prog-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #6080a0;
    }
    .prog-bar {
      height: 4px;
      background: #141e30;
      border-radius: 2px;
      overflow: hidden;
    }
    .prog-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    #status-bar {
      margin-top: auto;
      font-size: 11px;
      color: #3a5070;
      text-align: center;
      min-height: 14px;
    }

    /* Overlays */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .overlay.show { display: flex; }
    .overlay-bg {
      position: absolute;
      inset: 0;
      background: rgba(0,4,20,0.88);
    }
    .overlay-box {
      position: relative;
      background: #0d1830;
      border: 1px solid #2a4a80;
      border-radius: 16px;
      padding: 36px 44px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 0 60px rgba(60,120,255,0.2);
    }
    .overlay-box h2 { font-size: 28px; color: #5aff9f; }
    .overlay-box p  { font-size: 15px; color: #7aafff; }
    .big-btn { font-size: 15px; padding: 10px 28px; }

    /* Spinner */
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #1a3060;
      border-top-color: #5a9fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #hint-count { font-size: 11px; color: #3a7090; }

    @media (max-width: 540px) { #side-panel { display: none; } }
  </style>
</head>
<body>

<div id="header">
  <div id="title">Jumbo 3D Sudoku</div>
  <div id="header-right">
    <span id="timer">00:00</span>
    <select id="diff-sel">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button class="primary" id="new-btn">New Game</button>
    <button id="hint-btn">💡 Hint</button>
    <span id="hint-count"></span>
    <button id="undo-btn">↩ Undo</button>
  </div>
</div>

<div id="main">
  <div id="canvas-wrap"><!-- Three.js canvas injected here --></div>

  <div id="side-panel">

    <div>
      <div class="section-label">Numbers</div>
      <div id="num-pad">
        <button class="num-btn" data-n="1">1</button>
        <button class="num-btn" data-n="2">2</button>
        <button class="num-btn" data-n="3">3</button>
        <button class="num-btn" data-n="4">4</button>
        <button class="num-btn" data-n="5">5</button>
        <button class="num-btn" data-n="6">6</button>
        <button class="num-btn" data-n="7">7</button>
        <button class="num-btn" data-n="8">8</button>
        <button class="num-btn" data-n="9">9</button>
      </div>
      <button id="erase-btn">⌫  Erase</button>
      <button id="notes-btn">✏️  Notes: OFF</button>
    </div>

    <div>
      <div class="section-label">View Face</div>
      <div id="face-btns">
        <button class="face-btn active" data-face="-1">
          <span class="face-dot" style="background:#5a9fff"></span>All (isometric)
        </button>
        <button class="face-btn" data-face="0">
          <span class="face-dot" style="background:#5ad0aa"></span>Top face
        </button>
        <button class="face-btn" data-face="1">
          <span class="face-dot" style="background:#d07050"></span>Right face
        </button>
        <button class="face-btn" data-face="2">
          <span class="face-dot" style="background:#9060e0"></span>Front face
        </button>
      </div>
    </div>

    <div>
      <div class="section-label">Progress</div>
      <div id="progress-wrap">
        <div class="prog-row">
          <div class="prog-label">
            <span style="color:#5ad0aa">Top</span>
            <span id="prog-0">0/81</span>
          </div>
          <div class="prog-bar">
            <div class="prog-fill" id="pbar-0" style="background:#5ad0aa;width:0%"></div>
          </div>
        </div>
        <div class="prog-row">
          <div class="prog-label">
            <span style="color:#d07050">Right</span>
            <span id="prog-1">0/81</span>
          </div>
          <div class="prog-bar">
            <div class="prog-fill" id="pbar-1" style="background:#d07050;width:0%"></div>
          </div>
        </div>
        <div class="prog-row">
          <div class="prog-label">
            <span style="color:#9060e0">Front</span>
            <span id="prog-2">0/81</span>
          </div>
          <div class="prog-bar">
            <div class="prog-fill" id="pbar-2" style="background:#9060e0;width:0%"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="status-bar">Click a cell to begin</div>
  </div>
</div>

<!-- Win overlay -->
<div class="overlay" id="win-overlay">
  <div class="overlay-bg"></div>
  <div class="overlay-box">
    <div style="font-size:52px">🎉</div>
    <h2>Puzzle Solved!</h2>
    <p>You completed all three faces.</p>
    <p id="win-time" style="font-size:22px;color:#aad0ff;font-family:monospace"></p>
    <button class="big-btn primary" id="win-new-btn">Play Again</button>
    <button class="big-btn"
      onclick="document.getElementById('win-overlay').classList.remove('show')">Close</button>
  </div>
</div>

<!-- Loading overlay -->
<div class="overlay" id="loading-overlay">
  <div class="overlay-bg"></div>
  <div class="overlay-box" style="gap:16px">
    <div class="spinner"></div>
    <p>Generating puzzle…</p>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
